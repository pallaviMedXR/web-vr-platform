
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temporal Bone Atlas — Immersive VR</title>

<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #061326;
}

#instructions {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    color: #e9faff;
    background: rgba(4,20,40,.85);
    border: 1px solid #42e5ff;
    padding: 14px 22px;
    border-radius: 12px;
    text-align: center;
    pointer-events: none;
}

#instructions h2 {
    margin: 0 0 6px;
    font-size: 20px;
}

#instructions p {
    margin: 0;
    font-size: 13px;
    color: #9ac5d8;
}
</style>

<script>
// Automatically centre each loaded GLB model.
AFRAME.registerComponent('vr-center-model', {
    init: function () {
        this.el.addEventListener('model-loaded', () => {
            const mesh = this.el.getObject3D('mesh');
            if (!mesh) return;

            // Centre using mesh-local coordinates.
            const box = new THREE.Box3().setFromObject(mesh);
            const center = new THREE.Vector3();
            box.getCenter(center);

            const localCenter = this.el.object3D.worldToLocal(
                center.clone()
            );

            mesh.position.sub(localCenter);
        });
    }
});
</script>
</head>

<body>

<div id="instructions">
    <h2>Temporal Bone Atlas — VR</h2>
    <p>Enter VR to explore the anatomical models</p>
</div>

<a-scene
    background="color: #061326"
    vr-mode-ui="enabled: true"
    renderer="antialias: true">

    <!-- Virtual environment -->
    <a-sky color="#061326"></a-sky>

    <!-- Subtle holographic floor -->
    <a-circle
        position="0 0 -2.5"
        rotation="-90 0 0"
        radius="2.5"
        material="color: #06344d; opacity: 0.45; transparent: true; side: double">
    </a-circle>

    <a-ring
        position="0 0.01 -2.5"
        rotation="-90 0 0"
        radius-inner="1.8"
        radius-outer="1.82"
        material="color: #42e5ff; opacity: 0.65; transparent: true; side: double">
    </a-ring>

    <!-- External temporal bone -->
    <a-entity position="-0.65 1.5 -2.5">
        <a-entity
            gltf-model="url(ear_model_1_cleaned.glb)"
            scale="10 10 10"
            vr-center-model>
        </a-entity>
    </a-entity>

    <!-- Internal temporal bone -->
    <a-entity position="0.65 1.5 -2.5">
        <a-entity
            gltf-model="url(ear-model-2.glb)"
            scale="1 1 1"
            vr-center-model>
        </a-entity>
    </a-entity>

    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 1"></a-entity>

    <a-entity
        light="type: directional; intensity: 0.8"
        position="1 4 2">
    </a-entity>

    <!-- VR camera -->
    <a-entity id="rig">
        <a-camera
            position="0 1.6 0"
            look-controls="enabled: true"
            wasd-controls="enabled: false">
        </a-camera>

        <!-- Quest controllers -->
        <a-entity
            laser-controls="hand: left">
        </a-entity>

        <a-entity
            laser-controls="hand: right">
        </a-entity>
    </a-entity>

</a-scene>

</body>
</html>
