
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Temporal Bone Atlas — Immersive VR</title>

<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

<style>
@font-face {
    font-family: Inter;
    src: url("assets/fonts/InterVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
}
body {
    margin: 0;
    background: #061326;
    font-family: "OpenAI Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

#instructions {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;

    color: #e9faff;
    background: rgba(4,20,40,0.85);
    border: 1px solid #42e5ff;

    padding: 14px 22px;
    border-radius: 12px;
    text-align: center;
    pointer-events: none;
}

body.in-vr #instructions { display: none; }
a-scene canvas { touch-action: none; }

#instructions h2 {
    margin: 0 0 6px;
    font-weight: 600;
    letter-spacing: -0.03em;
    font-size: 20px;
}

#instructions p {
    margin: 0;
    font-size: 13px;
    color: #9ac5d8;
}
</style>

<script>

// Rounded geometry keeps the interface inside the WebXR scene.
AFRAME.registerGeometry('rounded-panel', {
    schema: {
        width: {default: 1},
        height: {default: 1},
        radius: {default: 0.06}
    },
    init: function (data) {
        const x = -data.width / 2;
        const y = -data.height / 2;
        const w = data.width;
        const h = data.height;
        const r = Math.max(0, Math.min(data.radius, w / 2, h / 2));
        const shape = new THREE.Shape();
        shape.moveTo(x + r, y);
        shape.lineTo(x + w - r, y);
        shape.quadraticCurveTo(x + w, y, x + w, y + r);
        shape.lineTo(x + w, y + h - r);
        shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        shape.lineTo(x + r, y + h);
        shape.quadraticCurveTo(x, y + h, x, y + h - r);
        shape.lineTo(x, y + r);
        shape.quadraticCurveTo(x, y, x + r, y);
        this.geometry = new THREE.ShapeGeometry(shape);
    }
});

/* Centre each loaded anatomical model */

AFRAME.registerComponent('vr-center-model', {

    init: function () {

        this.el.addEventListener('model-loaded', () => {

            const mesh = this.el.getObject3D('mesh');

            if (!mesh) return;

            this.el.object3D.updateWorldMatrix(true, true);

            const box = new THREE.Box3()
                .setFromObject(mesh);

            const center = new THREE.Vector3();

            box.getCenter(center);

            const localCenter =
                this.el.object3D.worldToLocal(
                    center.clone()
                );

            mesh.position.sub(localCenter);

        });

    }

});

</script>
<script src="quest-grab.js?v=3"></script>
<script src="immersive-lab.js?v=4"></script>
<script src="browser-model-controls.js?v=3"></script>
</head>

<body>

<!-- Desktop instructions -->

<div id="instructions">
    <h2>Temporal Bone Atlas — VR</h2>
    <p>Drag a model to rotate. Enter VR for 3D grabbing.</p>
</div>

<!-- Immersive VR scene -->

<a-scene immersive-lab browser-model-controls
    background="color: #061326"
    vr-mode-ui="enabled: true"
    renderer="antialias: true">

    <a-assets>
        <a-mixin id="lab-panel" material="shader: flat; color: #071c32; opacity: 0.7; transparent: true; depthWrite: false; side: double"></a-mixin>
        <a-mixin id="lab-button" material="shader: flat; color: #06344d; opacity: 0.7; transparent: true; depthWrite: false; side: double"></a-mixin>
        <a-mixin id="lab-text" ui-text="color: #e9faff; width: 1; fontSize: 0.052"></a-mixin>
    </a-assets>

    <!-- Virtual environment -->

    <a-sky color="#061326"></a-sky>

    <!-- Holographic floor -->

    <a-circle
        position="0 0 -2.5"
        rotation="-90 0 0"
        radius="2.5"
        material="
            color: #06344d;
            opacity: 0.45;
            transparent: true;
            side: double">
    </a-circle>

    <!-- Blue holographic ring -->

    <a-ring
        position="0 0.01 -2.5"
        rotation="-90 0 0"
        radius-inner="1.8"
        radius-outer="1.82"
        material="
            color: #42e5ff;
            opacity: 0.65;
            transparent: true;
            side: double">
    </a-ring>

    <!-- MODEL 1: EXTERNAL TEMPORAL BONE -->

    <a-entity
        id="externalVR" class="grabbable"
        position="-0.65 1.5 -2.5">

        <a-entity
            gltf-model="url(ear_model_1_cleaned.glb)"
            scale="10 10 10"
            vr-center-model>
        </a-entity>
        <a-entity class="specimen-label" visible="false" position="0 -0.55 0.05">
            <a-plane geometry="primitive: rounded-panel" mixin="lab-panel" width="0.8" height="0.14"></a-plane>
            <a-atlas-text value="External specimen" align="center" width="0.76" font-size="0.034" position="0 0 0.01"></a-atlas-text>
        </a-entity>

    </a-entity>

    <!-- MODEL 2: INTERNAL TEMPORAL BONE -->

    <a-entity
        id="internalVR" class="grabbable"
        position="0.65 1.5 -2.5">

        <a-entity
            gltf-model="url(ear-model-2.glb)"
            scale="1 1 1"
            vr-center-model>
        </a-entity>
        <a-entity class="specimen-label" visible="false" position="0 -0.55 0.05">
            <a-plane geometry="primitive: rounded-panel" mixin="lab-panel" width="0.8" height="0.14"></a-plane>
            <a-atlas-text value="Internal specimen" align="center" width="0.76" font-size="0.034" position="0 0 0.01"></a-atlas-text>
        </a-entity>

    </a-entity>

    <!-- One title per mode: the web header on desktop, this compact heading in VR. -->
    <a-entity id="vrOnlyTitle" visible="false" position="0 2.8 -3.2">
        <a-atlas-text value="Temporal Bone Atlas" align="center" width="2.5"
            font-size="0.075" font-weight="600" color="#e9faff"></a-atlas-text>
    </a-entity>

    <a-atlas-text id="externalHeading" value="External view" font-size="0.05" font-weight="500" align="center"
        color="#b8f3ff" width="1.6" position="-0.65 2.08 -2.5"></a-atlas-text>
    <a-atlas-text id="internalHeading" value="Internal view" font-size="0.05" font-weight="500" align="center"
        color="#b8f3ff" width="1.6" position="0.65 2.08 -2.5"></a-atlas-text>

    <!-- Left-side toolbar, facing the viewing area. -->
    <a-entity id="labToolbar" position="-2.4 1.95 -3" rotation="0 25 0">
        <a-plane geometry="primitive: rounded-panel" mixin="lab-panel" width="1.1" height="1.45"></a-plane>
        <a-atlas-text mixin="lab-text" value="Laboratory" font-size="0.062" font-weight="600" color="#42e5ff"
            align="center" width="1.3" position="0 0.59 0.015"></a-atlas-text>
        <a-entity position="0 0.36 0.02">
            <a-plane lab-action="models" geometry="primitive: rounded-panel" mixin="lab-button" width="0.9" height="0.19"></a-plane>
            <a-atlas-text mixin="lab-text" value="Models" align="center" position="0 0 0.01"></a-atlas-text>
        </a-entity>
        <a-entity position="0 0.12 0.02">
            <a-plane lab-action="labels" geometry="primitive: rounded-panel" mixin="lab-button" width="0.9" height="0.19"></a-plane>
            <a-atlas-text mixin="lab-text" id="labelsText" value="Show Labels" align="center" position="0 0 0.01"></a-atlas-text>
        </a-entity>
        <a-entity position="0 -0.12 0.02">
            <a-plane lab-action="info" geometry="primitive: rounded-panel" mixin="lab-button" width="0.9" height="0.19"></a-plane>
            <a-atlas-text mixin="lab-text" value="Anatomy Info" align="center" position="0 0 0.01"></a-atlas-text>
        </a-entity>
        <a-entity position="0 -0.36 0.02">
            <a-plane lab-action="compare" geometry="primitive: rounded-panel" mixin="lab-button" width="0.9" height="0.19" material="color: #005777"></a-plane>
            <a-atlas-text mixin="lab-text" value="Compare" align="center" position="0 0 0.01"></a-atlas-text>
        </a-entity>
        <a-entity position="0 -0.60 0.02">
            <a-plane lab-action="reset" geometry="primitive: rounded-panel" mixin="lab-button" width="0.9" height="0.19"></a-plane>
            <a-atlas-text mixin="lab-text" value="Reset View" align="center" position="0 0 0.01"></a-atlas-text>
        </a-entity>
    </a-entity>

    <!-- Model library, toggled with Models. -->
    <a-entity id="labLibrary" visible="false" position="-2.4 0.55 -3" rotation="0 25 0">
        <a-plane geometry="primitive: rounded-panel" mixin="lab-panel" width="1.1" height="0.95"></a-plane>
        <a-atlas-text mixin="lab-text" value="Model library" font-size="0.062" font-weight="600" color="#42e5ff"
            align="center" width="1.3" position="0 0.35 0.015"></a-atlas-text>
        <a-atlas-text mixin="lab-text" value="Head &amp; Neck" color="#b8f3ff"
            position="-0.46 0.19 0.015"></a-atlas-text>
        <a-plane lab-action="open-ear" geometry="primitive: rounded-panel" mixin="lab-button" width="0.94" height="0.16" position="0 0.03 0.015"></a-plane>
        <a-atlas-text mixin="lab-text" value="Temporal Bone - 2 Models" width="0.95"
            align="center" position="0 0.03 0.025"></a-atlas-text>
        <a-atlas-text mixin="lab-text" font-size="0.036" value="Central Nervous System\nBrain - Coming soon\n\nCardiovascular System\nHeart - Coming soon"
            width="0.94" color="#9ac5d8" position="-0.46 -0.23 0.015"></a-atlas-text>
    </a-entity>

    <!-- Right-side anatomy information, matching the lab's initial external view. -->
    <a-entity id="labAnatomyInfo" visible="false" position="2.4 1.6 -3" rotation="0 -25 0">
        <a-plane geometry="primitive: rounded-panel" mixin="lab-panel" width="1.35" height="1.55"></a-plane>
        <a-atlas-text mixin="lab-text" value="Anatomy information" font-size="0.062" font-weight="600" color="#42e5ff"
            align="center" width="1.45" position="0 0.61 0.015"></a-atlas-text>
        <a-entity position="-0.29 0.38 0.02">
            <a-plane lab-action="external" geometry="primitive: rounded-panel" mixin="lab-button" width="0.52" height="0.19" material="color: #005777"></a-plane>
            <a-atlas-text mixin="lab-text" value="External" align="center" position="0 0 0.01"></a-atlas-text>
        </a-entity>
        <a-entity position="0.29 0.38 0.02">
            <a-plane lab-action="internal" geometry="primitive: rounded-panel" mixin="lab-button" width="0.52" height="0.19"></a-plane>
            <a-atlas-text mixin="lab-text" value="Internal" align="center" position="0 0 0.01"></a-atlas-text>
        </a-entity>
        <a-atlas-text mixin="lab-text" id="infoTitle" value="Temporal Bone - External View" font-weight="500"
            width="1.15" align="center" position="0 0.15 0.015"></a-atlas-text>
        <a-atlas-text id="infoDescription" mixin="lab-text" font-size="0.045"
            value="The temporal bone forms part of the lateral skull and cranial base. It contributes to the temporomandibular joint and houses structures associated with hearing and balance."
            width="1.1" wrap-count="32" baseline="top" anchor="left"
            position="-0.55 -0.02 0.015"></a-atlas-text>
        <a-atlas-text mixin="lab-text" value="External and internal specimen views"
            color="#9ac5d8" width="1.05" align="center" position="0 -0.62 0.015"></a-atlas-text>
    </a-entity>

    <!-- Interactive view selector. -->
    <a-entity id="labViewSelector" position="0 0.65 -2.65" rotation="-10 0 0">
        <a-plane geometry="primitive: rounded-panel" mixin="lab-panel" width="2.65" height="0.4"></a-plane>
        <a-entity position="-0.85 0 0.015">
            <a-plane lab-action="external" geometry="primitive: rounded-panel" mixin="lab-button" width="0.77" height="0.25"></a-plane>
            <a-atlas-text mixin="lab-text" value="External" width="1.25" align="center" position="0 0 0.01"></a-atlas-text>
        </a-entity>
        <a-entity position="0 0 0.015">
            <a-plane lab-action="internal" geometry="primitive: rounded-panel" mixin="lab-button" width="0.77" height="0.25"></a-plane>
            <a-atlas-text mixin="lab-text" value="Internal" width="1.25" align="center" position="0 0 0.01"></a-atlas-text>
        </a-entity>
        <a-entity position="0.85 0 0.015">
            <a-plane lab-action="compare" geometry="primitive: rounded-panel" mixin="lab-button" width="0.77" height="0.25" material="color: #005777"></a-plane>
            <a-atlas-text mixin="lab-text" value="Compare Both" width="1.2" align="center" position="0 0 0.01"></a-atlas-text>
        </a-entity>
        <a-atlas-text font-size="0.04" value="Hold trigger / grip to grab | Stick up/down: distance, left/right: rotate | A / X: reset" color="#81cddd"
            align="center" width="2.65" position="0 -0.35 0.02"></a-atlas-text>
    </a-entity>

    <!-- Ambient lighting -->

    <a-entity
        light="type: ambient; intensity: 1">
    </a-entity>

    <!-- Directional lighting -->

    <a-entity
        light="type: directional; intensity: 0.8"
        position="1 4 2">
    </a-entity>

    <!-- VR CAMERA AND CONTROLLERS -->

    <a-entity id="rig">

        <a-camera
            position="0 1.6 0"
            look-controls="enabled: false"
            wasd-controls="enabled: false">
            <a-entity id="desktopCursor" cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .lab-hit; interval: 50"></a-entity>
        </a-camera>

        <!-- Left Quest controller -->

        <a-entity
            id="leftHand"
            laser-controls="hand: left" quest-grab
            raycaster="objects: .lab-hit, .model-hit; far: 8; interval: 50; lineColor: #42e5ff">
        </a-entity>

        <!-- Right Quest controller -->

        <a-entity
            id="rightHand"
            laser-controls="hand: right" quest-grab
            raycaster="objects: .lab-hit, .model-hit; far: 8; interval: 50; lineColor: #42e5ff">
        </a-entity>

    </a-entity>

</a-scene>

</body>
</html>
