
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Temporal Bone Atlas — Immersive VR</title>

<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

<style>
body {
    margin: 0;
    background: #061326;
    font-family: Arial, sans-serif;
}

#instructions {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;

    color: #e9faff;
    background: rgba(4,20,40,0.85);
    border: 1px solid #42e5ff;

    padding: 14px 22px;
    border-radius: 12px;
    text-align: center;
    pointer-events: none;
}

#instructions h2 {
    margin: 0 0 6px;
    font-size: 20px;
}

#instructions p {
    margin: 0;
    font-size: 13px;
    color: #9ac5d8;
}
</style>

<script>

/* Centre each loaded anatomical model */

AFRAME.registerComponent('vr-center-model', {

    init: function () {

        this.el.addEventListener('model-loaded', () => {

            const mesh = this.el.getObject3D('mesh');

            if (!mesh) return;

            const box = new THREE.Box3()
                .setFromObject(mesh);

            const center = new THREE.Vector3();

            box.getCenter(center);

            const localCenter =
                this.el.object3D.worldToLocal(
                    center.clone()
                );

            mesh.position.sub(localCenter);

        });

    }

});

</script>
</head>

<body>

<!-- Desktop instructions -->

<div id="instructions">
    <h2>Temporal Bone Atlas — VR</h2>
    <p>Enter VR to inspect the static laboratory layout</p>
</div>

<!-- Immersive VR scene -->

<a-scene
    background="color: #061326"
    vr-mode-ui="enabled: true"
    renderer="antialias: true">

    <a-assets>
        <a-mixin id="lab-panel" material="shader: flat; color: #071c32; opacity: 0.96; transparent: true; side: double"></a-mixin>
        <a-mixin id="lab-button" material="shader: flat; color: #06344d; side: double"></a-mixin>
        <a-mixin id="lab-text" text="color: #e9faff; font: roboto; width: 1; wrapCount: 28"></a-mixin>
    </a-assets>

    <!-- Virtual environment -->

    <a-sky color="#061326"></a-sky>

    <!-- Holographic floor -->

    <a-circle
        position="0 0 -2.5"
        rotation="-90 0 0"
        radius="2.5"
        material="
            color: #06344d;
            opacity: 0.45;
            transparent: true;
            side: double">
    </a-circle>

    <!-- Blue holographic ring -->

    <a-ring
        position="0 0.01 -2.5"
        rotation="-90 0 0"
        radius-inner="1.8"
        radius-outer="1.82"
        material="
            color: #42e5ff;
            opacity: 0.65;
            transparent: true;
            side: double">
    </a-ring>

    <!-- MODEL 1: EXTERNAL TEMPORAL BONE -->

    <a-entity
        id="externalVR"
        position="-0.65 1.5 -2.5">

        <a-entity
            gltf-model="url(ear_model_1_cleaned.glb)"
            scale="10 10 10"
            vr-center-model>
        </a-entity>

    </a-entity>

    <!-- MODEL 2: INTERNAL TEMPORAL BONE -->

    <a-entity
        id="internalVR"
        position="0.65 1.5 -2.5">

        <a-entity
            gltf-model="url(ear-model-2.glb)"
            scale="1 1 1"
            vr-center-model>
        </a-entity>

    </a-entity>

    <!-- Static holographic interface. Buttons are visual only in this layout study. -->
    <a-entity id="labTitle" position="0 2.6 -2.8">
        <a-plane mixin="lab-panel" width="3.2" height="0.48"></a-plane>
        <a-text value="TEMPORAL BONE ATLAS" align="center" color="#e9faff"
            width="3.4" position="0 0.08 0.015"></a-text>
        <a-text value="Interactive 3D Anatomy | Holographic Exploration" align="center"
            color="#42e5ff" width="2.7" position="0 -0.07 0.015"></a-text>
        <a-text value="STATIC LAYOUT PREVIEW" align="center" color="#9ac5d8"
            width="1.7" position="0 -0.17 0.015"></a-text>
    </a-entity>

    <a-text id="externalHeading" value="EXTERNAL VIEW" align="center"
        color="#b8f3ff" width="1.6" position="-0.65 2.08 -2.5"></a-text>
    <a-text id="internalHeading" value="INTERNAL VIEW" align="center"
        color="#b8f3ff" width="1.6" position="0.65 2.08 -2.5"></a-text>

    <!-- Left-side toolbar, facing the viewing area. -->
    <a-entity id="labToolbar" position="-1.9 1.75 -2.8" rotation="0 25 0">
        <a-plane mixin="lab-panel" width="1.1" height="1.45"></a-plane>
        <a-text mixin="lab-text" value="LABORATORY" color="#42e5ff"
            align="center" width="1.3" position="0 0.59 0.015"></a-text>
        <a-entity position="0 0.36 0.02">
            <a-plane mixin="lab-button" width="0.9" height="0.19"></a-plane>
            <a-text mixin="lab-text" value="Models" align="center" position="0 0 0.01"></a-text>
        </a-entity>
        <a-entity position="0 0.12 0.02">
            <a-plane mixin="lab-button" width="0.9" height="0.19"></a-plane>
            <a-text mixin="lab-text" value="Show Labels" align="center" position="0 0 0.01"></a-text>
        </a-entity>
        <a-entity position="0 -0.12 0.02">
            <a-plane mixin="lab-button" width="0.9" height="0.19"></a-plane>
            <a-text mixin="lab-text" value="Anatomy Info" align="center" position="0 0 0.01"></a-text>
        </a-entity>
        <a-entity position="0 -0.36 0.02">
            <a-plane width="0.9" height="0.19" material="shader: flat; color: #005777"></a-plane>
            <a-text mixin="lab-text" value="Compare" align="center" position="0 0 0.01"></a-text>
        </a-entity>
        <a-entity position="0 -0.60 0.02">
            <a-plane mixin="lab-button" width="0.9" height="0.19"></a-plane>
            <a-text mixin="lab-text" value="Reset View" align="center" position="0 0 0.01"></a-text>
        </a-entity>
    </a-entity>

    <!-- Library stays open so its text and placement can be checked in the headset. -->
    <a-entity id="labLibrary" position="-1.9 0.49 -2.8" rotation="0 25 0">
        <a-plane mixin="lab-panel" width="1.1" height="0.95"></a-plane>
        <a-text mixin="lab-text" value="MODEL LIBRARY" color="#42e5ff"
            align="center" width="1.3" position="0 0.35 0.015"></a-text>
        <a-text mixin="lab-text" value="Head &amp; Neck" color="#b8f3ff"
            position="-0.46 0.19 0.015"></a-text>
        <a-plane mixin="lab-button" width="0.94" height="0.16" position="0 0.03 0.015"></a-plane>
        <a-text mixin="lab-text" value="Temporal Bone - 2 Models" width="0.95"
            align="center" position="0 0.03 0.025"></a-text>
        <a-text mixin="lab-text" value="Central Nervous System\nBrain - Coming soon\n\nCardiovascular System\nHeart - Coming soon"
            width="0.94" color="#9ac5d8" position="-0.46 -0.23 0.015"></a-text>
    </a-entity>

    <!-- Right-side anatomy information, matching the lab's initial external view. -->
    <a-entity id="labAnatomyInfo" position="1.95 1.55 -2.8" rotation="0 -25 0">
        <a-plane mixin="lab-panel" width="1.35" height="1.55"></a-plane>
        <a-text mixin="lab-text" value="ANATOMY INFORMATION" color="#42e5ff"
            align="center" width="1.45" position="0 0.61 0.015"></a-text>
        <a-entity position="-0.29 0.38 0.02">
            <a-plane width="0.52" height="0.19" material="shader: flat; color: #005777"></a-plane>
            <a-text mixin="lab-text" value="External" align="center" position="0 0 0.01"></a-text>
        </a-entity>
        <a-entity position="0.29 0.38 0.02">
            <a-plane mixin="lab-button" width="0.52" height="0.19"></a-plane>
            <a-text mixin="lab-text" value="Internal" align="center" position="0 0 0.01"></a-text>
        </a-entity>
        <a-text mixin="lab-text" value="Temporal Bone - External View"
            width="1.15" align="center" position="0 0.15 0.015"></a-text>
        <a-text mixin="lab-text"
            value="The temporal bone forms part of the lateral skull and cranial base. It contributes to the temporomandibular joint and houses structures associated with hearing and balance."
            width="1.1" wrap-count="32" baseline="top" anchor="left"
            position="-0.55 -0.02 0.015"></a-text>
        <a-text mixin="lab-text" value="External and internal specimen views"
            color="#9ac5d8" width="1.05" align="center" position="0 -0.62 0.015"></a-text>
    </a-entity>

    <!-- Bottom view selector: no click or grab handlers in this static version. -->
    <a-entity id="labViewSelector" position="0 0.8 -2.5" rotation="-10 0 0">
        <a-plane mixin="lab-panel" width="2.65" height="0.4"></a-plane>
        <a-entity position="-0.85 0 0.015">
            <a-plane mixin="lab-button" width="0.77" height="0.25"></a-plane>
            <a-text mixin="lab-text" value="External" width="1.25" align="center" position="0 0 0.01"></a-text>
        </a-entity>
        <a-entity position="0 0 0.015">
            <a-plane mixin="lab-button" width="0.77" height="0.25"></a-plane>
            <a-text mixin="lab-text" value="Internal" width="1.25" align="center" position="0 0 0.01"></a-text>
        </a-entity>
        <a-entity position="0.85 0 0.015">
            <a-plane width="0.77" height="0.25" material="shader: flat; color: #005777"></a-plane>
            <a-text mixin="lab-text" value="Compare Both" width="1.2" align="center" position="0 0 0.01"></a-text>
        </a-entity>
        <a-text value="Layout review: buttons and models are static" color="#81cddd"
            align="center" width="2.3" position="0 -0.35 0.02"></a-text>
    </a-entity>

    <!-- Ambient lighting -->

    <a-entity
        light="type: ambient; intensity: 1">
    </a-entity>

    <!-- Directional lighting -->

    <a-entity
        light="type: directional; intensity: 0.8"
        position="1 4 2">
    </a-entity>

    <!-- VR CAMERA AND CONTROLLERS -->

    <a-entity id="rig">

        <a-camera
            position="0 1.6 0"
            look-controls="enabled: true"
            wasd-controls="enabled: false">
        </a-camera>

        <!-- Left Quest controller -->

        <a-entity
            id="leftHand"
            laser-controls="hand: left">
        </a-entity>

        <!-- Right Quest controller -->

        <a-entity
            id="rightHand"
            laser-controls="hand: right">
        </a-entity>

    </a-entity>

</a-scene>

</body>
</html>
