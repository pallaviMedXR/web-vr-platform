
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Temporal Bone Atlas — Immersive VR</title>

<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

<style>
body {
    margin: 0;
    background: #061326;
    font-family: Arial, sans-serif;
}

#instructions {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    padding: 14px 22px;
    background: rgba(4,20,40,0.9);
    border: 1px solid #42e5ff;
    border-radius: 12px;
    color: #e9faff;
    text-align: center;
    pointer-events: none;
}

#instructions h2 {
    margin: 0 0 6px;
    font-size: 19px;
}

#instructions p {
    margin: 0;
    font-size: 13px;
    color: #9ac5d8;
}

#status {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #F4C76B;
    background: rgba(4,20,40,0.85);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 10;
}
</style>

<script>

/* ----------------------------------
   AUTOMATIC MODEL CENTRING AND SIZING
---------------------------------- */

AFRAME.registerComponent('vr-fit-model', {
    schema: {
        size: {type: 'number', default: 0.55}
    },

    init: function () {
        this.el.addEventListener('model-loaded', () => {

            const mesh = this.el.getObject3D('mesh');
            if (!mesh) return;

            mesh.updateMatrixWorld(true);

            const box = new THREE.Box3().setFromObject(mesh);

            const center = new THREE.Vector3();
            const dimensions = new THREE.Vector3();

            box.getCenter(center);
            box.getSize(dimensions);

            const maxDimension = Math.max(
                dimensions.x,
                dimensions.y,
                dimensions.z
            );

            if (maxDimension <= 0) return;

            const scale = this.data.size / maxDimension;

            // Apply centring and scaling to the mesh.
            mesh.position.sub(center);
            mesh.scale.setScalar(scale);

            this.el.emit('model-ready');
        });
    }
});


/* ----------------------------------
   QUEST CONTROLLER INTERACTIONS
---------------------------------- */

AFRAME.registerComponent('quest-interactions', {

    init: function () {

        this.models = [
            document.getElementById('externalVR'),
            document.getElementById('internalVR')
        ];

        this.controllers = {
            left: document.getElementById('leftHand'),
            right: document.getElementById('rightHand')
        };

        this.grabs = {
            left: null,
            right: null
        };

        this.twoHand = null;

        this.raycaster = new THREE.Raycaster();

        this.tempPosition = new THREE.Vector3();
        this.tempQuaternion = new THREE.Quaternion();
        this.tempDirection = new THREE.Vector3();

        
this.controllers.left.addEventListener(
    'gripbuttondown',
    () => this.startGrab('left')
);

this.controllers.left.addEventListener(
    'gripbuttonup',
    () => this.stopGrab('left')
);

this.controllers.right.addEventListener(
    'gripbuttondown',
    () => this.startGrab('right')
);

this.controllers.right.addEventListener(
    'gripbuttonup',
    () => this.stopGrab('right')
);

    },


    /* Find the anatomical model */

    findTarget: function (hand) {

        const controller = this.controllers[hand].object3D;

        controller.getWorldPosition(this.tempPosition);
        controller.getWorldQuaternion(this.tempQuaternion);

        this.tempDirection.set(0, 0, -1)
            .applyQuaternion(this.tempQuaternion)
            .normalize();

        this.raycaster.set(
            this.tempPosition,
            this.tempDirection
        );

        this.raycaster.far = 6;

        let nearest = null;
        let nearestDistance = Infinity;

        this.models.forEach(model => {

            const gltf = model.querySelector('[gltf-model]');
            const mesh = gltf && gltf.getObject3D('mesh');

            if (!mesh) return;

            mesh.updateMatrixWorld(true);

            const hits = this.raycaster.intersectObject(
                mesh,
                true
            );

            if (
                hits.length > 0 &&
                hits[0].distance < nearestDistance
            ) {
                nearest = model;
                nearestDistance = hits[0].distance;
            }
        });

        return nearest;
    },


    /* Begin grabbing */

    startGrab: function (hand) {

        const controller = this.controllers[hand].object3D;
        const model = this.findTarget(hand);

        if (!model) return;

        const otherHand = hand === 'left'
            ? 'right'
            : 'left';

        controller.updateMatrixWorld(true);
        model.object3D.updateMatrixWorld(true);

        const offset = controller.matrixWorld.clone()
            .invert()
            .multiply(model.object3D.matrixWorld);

        this.grabs[hand] = {
            model: model,
            offset: offset
        };

        if (
            this.grabs[otherHand] &&
            this.grabs[otherHand].model === model
        ) {
            this.beginTwoHand(model);
        }

        console.log('Grabbed:', model.id);
    },


    /* Release model */

    stopGrab: function (hand) {

        this.grabs[hand] = null;
        this.twoHand = null;

        const otherHand = hand === 'left'
            ? 'right'
            : 'left';

        if (this.grabs[otherHand]) {

            const model = this.grabs[otherHand].model;
            const controller =
                this.controllers[otherHand].object3D;

            controller.updateMatrixWorld(true);
            model.object3D.updateMatrixWorld(true);

            this.grabs[otherHand].offset =
                controller.matrixWorld.clone()
                    .invert()
                    .multiply(model.object3D.matrixWorld);
        }
    },


    /* Start two-handed scaling */

    beginTwoHand: function (model) {

        const left = this.controllers.left.object3D;
        const right = this.controllers.right.object3D;

        const p1 = new THREE.Vector3();
        const p2 = new THREE.Vector3();

        left.getWorldPosition(p1);
        right.getWorldPosition(p2);

        const midpoint = p1.clone()
            .add(p2)
            .multiplyScalar(0.5);

        const direction = p2.clone()
            .sub(p1)
            .normalize();

        const object = model.object3D;

        this.twoHand = {
            model: model,
            distance: Math.max(p1.distanceTo(p2), 0.01),
            scale: object.scale.x,
            position: object.position.clone(),
            quaternion: object.quaternion.clone(),
            midpoint: midpoint,
            direction: direction
        };
    },


    /* Update controller movement */

    tick: function () {

        const leftGrab = this.grabs.left;
        const rightGrab = this.grabs.right;

        if (
            this.twoHand &&
            leftGrab &&
            rightGrab &&
            leftGrab.model === rightGrab.model
        ) {
            this.updateTwoHand();
            return;
        }

        ['left', 'right'].forEach(hand => {

            const grab = this.grabs[hand];
            if (!grab) return;

            const controller = this.controllers[hand].object3D;
            const object = grab.model.object3D;

            controller.updateMatrixWorld(true);

            const worldMatrix = controller.matrixWorld.clone()
                .multiply(grab.offset);

            const parentMatrix = object.parent.matrixWorld
                .clone()
                .invert();

            const localMatrix = parentMatrix.multiply(worldMatrix);

            const position = new THREE.Vector3();
            const quaternion = new THREE.Quaternion();
            const scale = new THREE.Vector3();

            localMatrix.decompose(
                position,
                quaternion,
                scale
            );

            object.position.copy(position);
            object.quaternion.copy(quaternion);
        });
    },


    /* Two-handed resizing */

    updateTwoHand: function () {

        const data = this.twoHand;

        const left = this.controllers.left.object3D;
        const right = this.controllers.right.object3D;

        const p1 = new THREE.Vector3();
        const p2 = new THREE.Vector3();

        left.getWorldPosition(p1);
        right.getWorldPosition(p2);

        const midpoint = p1.clone()
            .add(p2)
            .multiplyScalar(0.5);

        const direction = p2.clone()
            .sub(p1)
            .normalize();

        const distance = p1.distanceTo(p2);

        const factor = THREE.MathUtils.clamp(
            distance / data.distance,
            0.3,
            4
        );

        const scale = THREE.MathUtils.clamp(
            data.scale * factor,
            0.25,
            4
        );

        const rotation = new THREE.Quaternion()
            .setFromUnitVectors(
                data.direction,
                direction
            );

        const object = data.model.object3D;

        object.scale.setScalar(scale);

        object.quaternion.copy(
            rotation.clone().multiply(data.quaternion)
        );

        const offset = data.position.clone()
            .sub(data.midpoint)
            .multiplyScalar(scale / data.scale)
            .applyQuaternion(rotation);

        object.position.copy(
            midpoint.clone().add(offset)
        );
    }
});

</script>
</head>

<body>

<div id="instructions">
    <h2>Temporal Bone Atlas — VR</h2>
    <p>Point at a model and hold Grip to move it. Use both Grips to resize.</p>
</div>

<div id="status">
    Quest 3 Interactive Anatomy Laboratory
</div>

<a-scene
    background="color: #061326"
    vr-mode-ui="enabled: true"
    renderer="antialias: true">

    <!-- Holographic environment -->

    <a-sky color="#061326"></a-sky>

    <a-circle
        position="0 0 -2.5"
        rotation="-90 0 0"
        radius="2.5"
        material="color: #06344d; opacity: 0.45; transparent: true; side: double">
    </a-circle>

    <a-ring
        position="0 0.01 -2.5"
        rotation="-90 0 0"
        radius-inner="1.8"
        radius-outer="1.82"
        material="color: #42e5ff; opacity: 0.65; transparent: true; side: double">
    </a-ring>


    <!-- External temporal bone -->

    <a-entity
       
    id="externalVR"
    class="vr-target"
    position="-0.55 1.5 -2.2">

        <a-entity
            gltf-model="url(ear_model_1_cleaned.glb)"
            vr-fit-model="size: 0.6">
        </a-entity>

    </a-entity>


    <!-- Internal temporal bone -->

    <a-entity
    id="internalVR"
    class="vr-target"
    position="0.55 1.5 -2.2">

        <a-entity
            gltf-model="url(ear-model-2.glb)"
            vr-fit-model="size: 0.6">
        </a-entity>

    </a-entity>


    <!-- Lighting -->

    <a-entity
        light="type: ambient; intensity: 1">
    </a-entity>

    <a-entity
        light="type: directional; intensity: 0.8"
        position="1 4 2">
    </a-entity>


    <!-- VR camera and controllers -->

    <a-entity id="rig">

        <a-camera
            position="0 1.6 0"
            look-controls="enabled: true"
            wasd-controls="enabled: false">
        </a-camera>

        
<!-- Left Quest 3 controller -->
<a-entity
    id="leftHand"
    laser-controls="hand: left"
    raycaster="objects: .vr-target; far: 10; showLine: true"
    line="color: #42e5ff; opacity: 0.9"
    cursor="rayOrigin: entity; fuse: false">

    <a-sphere
        radius="0.008"
        position="0 0 -0.5"
        material="color: #F4C76B; shader: flat">
    </a-sphere>
</a-entity>

<!-- Right Quest 3 controller -->
<a-entity
    id="rightHand"
    laser-controls="hand: right"
    raycaster="objects: .vr-target; far: 10; showLine: true"
    line="color: #42e5ff; opacity: 0.9"
    cursor="rayOrigin: entity; fuse: false">

    <a-sphere
        radius="0.008"
        position="0 0 -0.5"
        material="color: #F4C76B; shader: flat">
    </a-sphere>
</a-entity>


    </a-entity>


    <!-- Controller interaction manager -->

    <a-entity quest-interactions></a-entity>

</a-scene>

</body>
</html>
