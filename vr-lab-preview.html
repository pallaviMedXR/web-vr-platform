
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temporal Bone Atlas — VR Preview</title>

<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

<style>
body {
    margin: 0;
    background: #061326;
    font-family: Arial, sans-serif;
}

#instructions {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    padding: 12px 20px;
    color: #e9faff;
    background: rgba(4,20,40,.9);
    border: 1px solid #42e5ff;
    border-radius: 12px;
    text-align: center;
    pointer-events: none;
}

#instructions h2 {
    margin: 0 0 5px;
    font-size: 19px;
}

#instructions p {
    margin: 0;
    font-size: 12px;
    color: #9ac5d8;
}
</style>

<script>
/* Centre GLB geometry as in the original VR scene */

AFRAME.registerComponent('vr-center-model', {
    init: function () {
        this.el.addEventListener('model-loaded', () => {
            const mesh = this.el.getObject3D('mesh');
            if (!mesh) return;

            const box = new THREE.Box3().setFromObject(mesh);
            const center = new THREE.Vector3();

            box.getCenter(center);

            const localCenter = this.el.object3D.worldToLocal(
                center.clone()
            );

            mesh.position.sub(localCenter);
        });
    }
});

/* Dashed gold anatomical marker */

AFRAME.registerComponent('gold-marker', {
    init: function () {
        const group = new THREE.Group();
        const material = new THREE.LineBasicMaterial({
            color: 0xF4C76B,
            transparent: true,
            opacity: 0.75,
            depthWrite: false
        });

        const segments = 12;
        const radius = 0.027;

        for (let i = 0; i < segments; i++) {
            const start = i * Math.PI * 2 / segments;
            const end = (i + 0.55) * Math.PI * 2 / segments;

            const points = [];

            for (let j = 0; j <= 4; j++) {
                const angle = start + (end-start) * j / 4;

                points.push(new THREE.Vector3(
                    Math.cos(angle) * radius,
                    Math.sin(angle) * radius,
                    0
                ));
            }

            group.add(new THREE.Line(
                new THREE.BufferGeometry().setFromPoints(points),
                material
            ));
        }

        this.el.object3D.add(group);
        this.ring = group;
        this.cameraQ = new THREE.Quaternion();
        this.parentQ = new THREE.Quaternion();
    },

    tick: function () {
        const camera = this.el.sceneEl.camera;
        if (!camera) return;

        camera.getWorldQuaternion(this.cameraQ);
        this.el.object3D.getWorldQuaternion(this.parentQ);

        this.ring.quaternion.copy(
            this.parentQ.invert().multiply(this.cameraQ)
        );
    },

    remove: function () {
        this.el.object3D.remove(this.ring);
        this.ring.children.forEach(line => {
            line.geometry.dispose();
            line.material.dispose();
        });
    }
});
</script>
</head>

<body>

<div id="instructions">
    <h2>Temporal Bone Atlas — VR Preview</h2>
    <p>Immersive anatomy laboratory interface preview</p>
</div>

<a-scene
    background="color: #061326"
    vr-mode-ui="enabled: true"
    renderer="antialias: true">

    <a-sky color="#061326"></a-sky>

    <!-- Holographic platform -->

    <a-circle
        position="0 0 -2.5"
        rotation="-90 0 0"
        radius="1.8"
        material="color: #06344d; opacity: 0.45; transparent: true; side: double">
    </a-circle>

    <a-ring
        position="0 0.01 -2.5"
        rotation="-90 0 0"
        radius-inner="1.65"
        radius-outer="1.67"
        material="color: #42e5ff; opacity: 0.65; transparent: true; side: double">
    </a-ring>

    <!-- Title inside VR -->

    <a-entity position="0 2.55 -3">
        <a-plane
            width="2.9"
            height="0.42"
            color="#071c32"
            opacity="0.92">
        </a-plane>

        <a-text
            value="TEMPORAL BONE ATLAS"
            align="center"
            color="#e9faff"
            width="3.2"
            position="0 0.07 0.01">
        </a-text>

        <a-text
            value="HOLOGRAPHIC ANATOMY LABORATORY"
            align="center"
            color="#42e5ff"
            width="2"
            position="0 -0.1 0.01">
        </a-text>
    </a-entity>

    <!-- External model -->

    <a-entity
        id="externalVR"
        position="-0.65 1.5 -2.5">

        <a-entity
            gltf-model="url(ear_model_1_cleaned.glb)"
            scale="10 10 10"
            vr-center-model>

        </a-entity>
    </a-entity>

    <!-- Internal model -->

    <a-entity
        id="internalVR"
        position="0.65 1.5 -2.5">

        <a-entity
            gltf-model="url(ear-model-2.glb)"
            scale="1 1 1"
            vr-center-model>
        </a-entity>
    </a-entity>

    <!-- Model headings -->

    <a-text
        value="EXTERNAL VIEW"
        align="center"
        color="#b8f3ff"
        width="1.7"
        position="-0.65 2.05 -2.5">
    </a-text>

    <a-text
        value="INTERNAL VIEW"
        align="center"
        color="#b8f3ff"
        width="1.7"
        position="0.65 2.05 -2.5">
    </a-text>

    <!-- Floating VR menu: visual preview -->

    <a-entity position="0 0.85 -2.6">

        <a-plane
            width="2.75"
            height="0.48"
            color="#071c32"
            opacity="0.95">
        </a-plane>

        <a-plane
            position="-0.88 0 0.01"
            width="0.78"
            height="0.32"
            color="#06344d">
        </a-plane>

        <a-text
            value="EXTERNAL"
            align="center"
            color="#e9faff"
            width="1.2"
            position="-0.88 0 0.02">
        </a-text>

        <a-plane
            position="0 0 0.01"
            width="0.78"
            height="0.32"
            color="#06344d">
        </a-plane>

        <a-text
            value="INTERNAL"
            align="center"
            color="#e9faff"
            width="1.2"
            position="0 0 0.02">
        </a-text>

        <a-plane
            position="0.88 0 0.01"
            width="0.78"
            height="0.32"
            color="#005777">
        </a-plane>

        <a-text
            value="COMPARE"
            align="center"
            color="#e9faff"
            width="1.2"
            position="0.88 0 0.02">
        </a-text>
    </a-entity>

    <!-- Anatomy Information panel -->

    <a-entity position="2.1 1.65 -3.5"
              rotation="0 -25 0">

        <a-plane
            width="1.25"
            height="1.15"
            color="#071c32"
            opacity="0.94">
        </a-plane>

        <a-text
            value="ANATOMY INFORMATION"
            color="#42e5ff"
            align="center"
            width="1.35"
            position="0 0.42 0.01">
        </a-text>

        <a-text
            value="Temporal Bone"
            color="#ffffff"
            align="center"
            width="1.3"
            position="0 0.2 0.01">
        </a-text>

        <a-text
            value="The temporal bone forms part of the lateral skull and cranial base. It houses structures associated with hearing and balance."
            color="#cfe9f5"
            width="1.05"
            wrap-count="28"
            position="-0.5 0.05 0.01">
        </a-text>
    </a-entity>

    <!-- Lighting -->

    <a-entity
        light="type: ambient; intensity: 1">
    </a-entity>

    <a-entity
        light="type: directional; intensity: 0.8"
        position="1 4 2">
    </a-entity>

    <!-- VR camera and controllers -->

    <a-entity id="rig">

        <a-camera
            position="0 1.6 0"
            look-controls="enabled: true"
            wasd-controls="enabled: false">
        </a-camera>

        <a-entity laser-controls="hand: left"></a-entity>
        <a-entity laser-controls="hand: right"></a-entity>

    </a-entity>

</a-scene>

</body>
</html>
